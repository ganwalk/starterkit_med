name: Deploy para GitHub Pages

on:
  push:
    # A branch de trabalho publica para dar preview antes do merge.
    # Quando o projeto estabilizar, restringir para main.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - run: npm run build

      # Requer o Pages já habilitado em Settings → Pages → Source: GitHub Actions.
      # Não dá para ligar por aqui: criar o site exige permissão de administração,
      # que o GITHUB_TOKEN não recebe ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
